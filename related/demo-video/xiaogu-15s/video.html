<script type="text/babel">
  window.W = 1080; window.H = 1920;
  // 一条镜头轨：每段只有一次运动。钩子慢推 → 转折静止 → 证明下移 → 屏息推近第三行 → 品牌段拉回（落地感）
  function Piece() {
    const { T } = useComposition();
    const cam = camera(T, [
      [0, 1.0, 540, 960], [3, 1.05, 540, 960], [5, 1.05, 540, 960],
      [11, 1.05, 540, 1000], [12, 1.14, 540, 930], [12.5, 1.0, 540, 960], [15, 1.0, 540, 960],
    ], W, H);
    return (
      <div style={{ position: 'absolute', left: 0, top: 0, width: W, height: H, transformOrigin: '0 0', transform: cam }}>
        <Card />
        <Mascot />
        <Cta />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(
    <Composition width={W} height={H} scenes={window.LVA_SCENES} bg="#0a0a0a"><Piece /></Composition>
  );
</script>
