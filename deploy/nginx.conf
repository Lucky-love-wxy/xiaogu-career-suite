# /etc/nginx/conf.d/xiaogu.conf
# 把 example.cn 换成你备案通过的域名。证书用云厂商免费证书或 certbot，路径按实际改。
# 备案通过前，境内服务器的 80/443 对未备案域名会被云厂商拦截，这是正常的。

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name example.cn www.example.cn staging.example.cn;
    return 301 https://$host$request_uri;
}

# 生产
server {
    listen 443 ssl;
    http2 on;
    server_name example.cn www.example.cn;
    ssl_certificate     /etc/nginx/certs/example.cn.pem;
    ssl_certificate_key /etc/nginx/certs/example.cn.key;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式回答（SSE）：不能缓冲，否则用户要等整轮结束才看到过程
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# 测试环境：再加一层 HTTP 基础认证，只有自己能进
# 生成口令文件：htpasswd -c /etc/nginx/xiaogu-staging.htpasswd 你的用户名
server {
    listen 443 ssl;
    http2 on;
    server_name staging.example.cn;
    ssl_certificate     /etc/nginx/certs/staging.example.cn.pem;
    ssl_certificate_key /etc/nginx/certs/staging.example.cn.key;
    client_max_body_size 1m;
    auth_basic "xiaogu staging";
    auth_basic_user_file /etc/nginx/xiaogu-staging.htpasswd;
    add_header X-Robots-Tag "noindex" always;

    location / {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
