<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小谷求职</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<style>
:root{
  color-scheme:dark;
  /* 默认黑底白线；字体只用系统字体（Google Fonts 在中国大陆常被拦，会阻塞渲染） */
  --paper:#0a0a0a; --paper-2:#131312; --paper-3:#1f1f1d; --ink:#f2f2ee; --ink-2:#a3a39e; --ink-3:#6b6b67;
  --rule:#3d3d3a; --shu:#f2f2ee; --take:#a3a39e; --fuji:#f2f2ee; --kohaku:#a3a39e; --grain:none;
  --hover:rgba(242,242,238,.08); --active:rgba(242,242,238,.13); --scrim:rgba(0,0,0,.55); --pop:#1b1b1a;
  --r:10px; --r-sm:8px;   /* 按钮一律圆角矩形 */
  --side-w:264px; --rail-w:60px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","IBM Plex Mono",Menlo,Consolas,monospace;
}
/* 可选主题：和风（原配色），在用户菜单里切换，存在账号上 */
[data-theme="wa"]{
  --paper:#f6f3ec; --paper-2:#efeadf; --paper-3:#e6dfd0; --ink:#26241f; --ink-2:#5d5951; --ink-3:#9a958a;
  --rule:#d9d2c3; --shu:#b4432e; --take:#5f7a5a; --fuji:#7a6a8c; --kohaku:#b8893b; --pop:#fbf9f4;
  --grain:radial-gradient(rgba(38,36,31,.035) 1px,transparent 1px);
  --hover:rgba(38,36,31,.06); --active:rgba(38,36,31,.1); --scrim:rgba(38,36,31,.25); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
button,input{font:inherit; color:inherit}
body{
  background:var(--paper); color:var(--ink); font:15px/1.85 var(--sans);
  background-image:var(--grain); background-size:3px 3px;
  display:grid; grid-template-columns:var(--side-w) minmax(0,1fr) auto; height:100vh; height:100dvh; overflow:hidden;
  transition:grid-template-columns .28s var(--ease);
}
body.resizing{transition:none; cursor:col-resize; user-select:none}
body.collapsed{grid-template-columns:var(--rail-w) minmax(0,1fr) auto}
svg.i{width:18px; height:18px; flex:none}

/* 纯文字 / 图标按钮：平时只有字或图标，悬停 / 聚焦时显示圆角矩形底色 */
.tb{all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:6px 10px;
  border-radius:var(--r-sm); color:var(--ink-2); font-size:13px; line-height:1.4; white-space:nowrap; transition:background .15s,color .15s,transform .15s}
.tb:hover,.tb:focus-visible{background:var(--hover); color:var(--ink)}
.tb:active{transform:scale(.95)}
.tb.icon{width:36px; height:36px; padding:0; justify-content:center}
.beta{flex:none; font:500 10px/1 var(--mono); letter-spacing:.04em; color:var(--ink-3); border:1px solid var(--rule); border-radius:5px; padding:2px 5px}

/* ---------------- 左侧栏：视觉中心是历史对话 ---------------- */
.side{position:relative; display:flex; flex-direction:column; min-width:0; height:100vh; height:100dvh; overflow:hidden;
  background:var(--paper-2); border-right:1px solid var(--rule)}
.side-top{display:flex; align-items:center; gap:4px; padding:12px 10px 8px 18px; min-height:60px}
.brand{display:flex; align-items:center}
.brand .logo{height:28px; width:auto; display:block}
.side-top .tb.icon{margin-left:auto}
.actions{padding:0 10px 4px; display:flex; flex-direction:column; gap:2px}
.item{all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px;
  border-radius:var(--r-sm); font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; transition:background .15s}
.item:hover{background:var(--hover)}
.item.active{background:var(--active)}
.item .t{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis}
.item .sub{font:11px/1 var(--mono); color:var(--ink-3)}
.search{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r-sm); color:var(--ink-3); transition:background .15s}
.search:focus-within{background:var(--hover)}
.search input{all:unset; flex:1; min-width:0; font-size:14px; color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.side-scroll{flex:1; min-height:0; overflow-y:auto; padding:2px 10px 12px; mask-image:linear-gradient(#000 calc(100% - 24px), transparent)}
.group{margin:18px 10px 4px; font-size:12px; color:var(--ink-3)}
.hist .item{animation:slide .28s var(--ease) both}
@keyframes slide{from{opacity:0; transform:translateX(-6px)}to{opacity:1; transform:none}}
.hist .item .del{all:unset; cursor:pointer; opacity:0; width:24px; height:24px; display:grid; place-items:center; border-radius:6px; color:var(--ink-3); transition:opacity .15s,background .15s}
.hist .item:hover .del,.hist .item.active .del{opacity:1}
.hist .item .del:hover{background:var(--hover); color:var(--ink)}
.none{margin:14px 10px; font-size:13px; color:var(--ink-3); line-height:1.7}
/* 用户中心：一行头像，点开弹出菜单 */
.account{padding:8px 10px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--rule)}
.me-btn{all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:var(--r); transition:background .15s}
.me-btn:hover,.me-btn[aria-expanded="true"]{background:var(--hover)}
.avatar{width:30px; height:30px; flex:none; border-radius:var(--r-sm); background:var(--ink); color:var(--paper); display:grid; place-items:center; font:700 13px/1 var(--serif)}
.me-btn .meta{flex:1; min-width:0; line-height:1.35}
.me-btn .meta b{display:block; font:500 13px/1.35 var(--mono); overflow:hidden; text-overflow:ellipsis}
.me-btn .meta span{font:12px/1.35 var(--mono); color:var(--ink-2)}
.me-btn .meta span.low{color:var(--ink)}
.me-btn .chev{color:var(--ink-3)}
/* 拖动调宽（仅电脑端）。放在侧栏内：侧栏 overflow:hidden 会裁掉伸出去的部分 */
.grip{position:absolute; top:0; right:0; width:8px; height:100%; cursor:col-resize; z-index:5}
.grip:hover,.grip.on{background:linear-gradient(90deg,transparent 3px,var(--rule) 3px,var(--rule) 5px,transparent 5px)}
/* 收起：只剩一条图标栏，头像仍可点开菜单 */
.rail-only{display:none}
body.collapsed .full-only{display:none}
body.collapsed .rail-only{display:flex}
body.collapsed .side-top{padding:12px 0 8px; justify-content:center}
body.collapsed .actions{align-items:center; padding:0 0 4px}
body.collapsed .account{padding:8px 0 calc(10px + env(safe-area-inset-bottom)); display:flex; justify-content:center}
body.collapsed .me-btn{width:auto; padding:6px}
body.collapsed .me-btn .meta, body.collapsed .me-btn .chev, body.collapsed .grip{display:none}
.rail-only.col{flex-direction:column; align-items:center; gap:4px}
.scrim{display:none}

/* 弹出菜单（用户菜单、输入框 + 菜单）通用 */
.menu-pop{position:fixed; z-index:40; min-width:240px; padding:6px; border-radius:14px; background:var(--pop); border:1px solid var(--rule);
  box-shadow:0 18px 50px rgba(0,0,0,.45); opacity:0; transform:translateY(6px) scale(.97); transform-origin:var(--origin, 20% 100%);
  pointer-events:none; transition:opacity .16s var(--ease),transform .16s var(--ease)}
.menu-pop.open{opacity:1; transform:none; pointer-events:auto}
.menu-pop .head{padding:10px 12px 12px; border-bottom:1px solid var(--rule); margin-bottom:6px}
.menu-pop .head b{display:block; font:500 14px/1.4 var(--mono)}
.menu-pop .head span{font-size:12px; color:var(--ink-2)}
.meter{height:4px; border-radius:2px; background:var(--rule); margin-top:10px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--ink); border-radius:2px; transition:width .5s var(--ease)}
.mi{all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:12px; width:100%; padding:9px 12px; border-radius:var(--r-sm);
  font-size:14px; color:var(--ink); text-decoration:none; transition:background .12s}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi .r{margin-left:auto; font-size:12px; color:var(--ink-3)}
.mi .d{display:block; font-size:12px; color:var(--ink-3); line-height:1.4}
.menu-pop hr{border:0; border-top:1px solid var(--rule); margin:6px 4px}

/* ---------------- 中间 ---------------- */
main{display:flex; flex-direction:column; min-width:0; height:100vh; height:100dvh}
.bar{display:flex; align-items:center; gap:8px; padding:10px 16px; min-height:60px; font-size:13px; color:var(--ink-2)}
.bar .title{font:500 15px/1 var(--sans); color:var(--ink); padding:0 6px; white-space:nowrap}
.bar .model{font:12px/1 var(--mono); color:var(--ink-3)}
.bar .spacer{flex:1}
.envtag{font:500 11px/1 var(--sans); letter-spacing:.1em; color:var(--ink-2); border:1px solid var(--rule); border-radius:6px; padding:5px 8px; white-space:nowrap}
.practice{font:12px/1 var(--mono); color:var(--paper); background:var(--ink); border-radius:999px; padding:6px 10px; animation:fadein .3s var(--ease)}
#menu{display:none}

.log{flex:1; overflow-y:auto; padding:24px 24px; scroll-behavior:smooth}
.col{max-width:768px; margin:0 auto}

/* 空白状态：标题 + 输入框居中，快捷功能在输入框下方 */
body.fresh .log{flex:0 0 auto; overflow:visible; margin-top:auto; padding-bottom:10px}
body.fresh .compose{margin-bottom:auto; padding-bottom:12vh}
.empty{text-align:center; animation:rise .5s var(--ease) both}
body:not(.fresh) .empty{display:none}
.empty h2{font:700 30px/1.4 var(--serif); margin:0 0 6px; letter-spacing:.04em}
.empty p{color:var(--ink-2); margin:0}
.chips{display:none; flex-wrap:wrap; gap:8px; justify-content:center; max-width:768px; margin:14px auto 0}
body.fresh .chips{display:flex}
.chips button{all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border:1px solid var(--rule); border-radius:var(--r);
  font-size:13px; color:var(--ink-2); transition:background .15s,color .15s,transform .15s; animation:rise .45s var(--ease) both}
.chips button:nth-child(2){animation-delay:.04s} .chips button:nth-child(3){animation-delay:.08s}
.chips button:nth-child(4){animation-delay:.12s} .chips button:nth-child(5){animation-delay:.16s}
.chips button:hover{background:var(--hover); color:var(--ink); transform:translateY(-1px)}

/* 消息：用户在右侧圆角气泡，小谷不加框 */
.turn{margin:0 0 36px}
.me{margin-left:auto; max-width:78%; width:fit-content; background:var(--paper-3); border-radius:18px; padding:10px 18px;
  white-space:pre-wrap; max-height:11em; overflow:hidden; position:relative; animation:bubble .3s var(--ease) both; transform-origin:100% 100%}
@keyframes bubble{from{opacity:0; transform:translateY(8px) scale(.97)}to{opacity:1; transform:none}}
.me.long::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--paper-3))}
.who{font:500 11px/1 var(--sans); letter-spacing:.2em; color:var(--ink-3); margin:22px 0 8px; animation:fadein .3s var(--ease) .1s both}
.xg{animation:fadein .3s var(--ease) .12s both}
.xg ol{margin:6px 0 10px; padding-left:1.4em}
.xg ol li{padding:4px 0}
.xg ol li::before{display:none}
.xg p{margin:0 0 14px}
.xg strong{font:700 13px/1 var(--serif); letter-spacing:.2em; display:inline-block; margin-right:10px; color:var(--ink)}
.xg .sec{border-top:1px solid var(--rule); padding-top:14px; margin-top:18px}
.xg .ask{font:500 16px/1.8 var(--serif); margin-top:16px}
.xg ul{margin:6px 0 0; padding:0; list-style:none}
.xg li{padding:5px 0 5px 16px; position:relative; color:var(--ink)}
.xg li::before{content:""; position:absolute; left:0; top:15px; width:6px; height:1px; background:var(--ink-3)}
.xg .k{font-size:12px; letter-spacing:.06em; margin-right:6px; padding:1px 6px; border:1px solid currentColor; border-radius:5px}
.k.jd{color:var(--ink)} .k.ref{color:var(--take)} .k.ext{color:var(--fuji)} .k.inf{color:var(--kohaku)} .k.me{color:var(--shu)}
.xg a{color:var(--fuji)} .xg .fake{color:var(--ink-3); font-family:var(--mono); font-size:12px}
.xg.ask p{font:500 17px/1.8 var(--serif)}
.xg.blocked .sec.block{color:var(--shu)}
.xg .artifact{display:inline-block; margin:4px 0 6px; padding:9px 18px; border:1px solid var(--rule); border-radius:var(--r); color:var(--ink);
  text-decoration:none; font:500 14px/1.4 var(--sans); transition:background .15s,transform .15s}
.xg .artifact:hover{background:var(--hover); transform:translateY(-1px)}
.xg .pq{margin:2px 0 0; font-size:12px; letter-spacing:.1em; color:var(--ink-3)}
.xg .betatag{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:12px; color:var(--ink-3)}
/* 正在处理：三个跳动的点 + 当前阶段 */
.status{display:flex; align-items:center; gap:10px; margin:0 0 12px; font-size:13px; color:var(--ink-3)}
.dots{display:inline-flex; gap:4px}
.dots i{width:6px; height:6px; border-radius:50%; background:var(--ink-2); animation:hop 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none; opacity:.4}30%{transform:translateY(-4px); opacity:1}}

/* 输入框：圆角整框，左侧 + 放功能，右侧发送；框里不放提示文字 */
.compose{padding:8px 24px calc(14px + env(safe-area-inset-bottom))}
.box{position:relative; max-width:768px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; padding:8px 8px 8px 8px;
  background:var(--paper-2); border:1px solid var(--rule); border-radius:24px; transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--ink-2); box-shadow:0 0 0 4px rgba(242,242,238,.04)}
.box .plus{border-radius:var(--r)}
textarea{flex:1; resize:none; min-height:36px; max-height:220px; font:16px/1.75 var(--sans); color:var(--ink);
  background:transparent; border:0; padding:5px 4px; outline:none}
.send{all:unset; cursor:pointer; flex:none; width:36px; height:36px; display:grid; place-items:center; border-radius:var(--r);
  background:var(--ink); color:var(--paper); transition:opacity .2s,transform .15s}
.send:hover{transform:translateY(-1px)}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.25; cursor:default; transform:none}
.box.drop{border-color:var(--ink-2); border-style:dashed}
.ocr-note{max-width:768px; margin:8px auto 0; padding:0 16px; font-size:12px; color:var(--ink-2)}
.foot-note{max-width:768px; margin:8px auto 0; text-align:center; font-size:11px; color:var(--ink-3)}

/* 右侧运行记录（只在开发 / 测试环境出现） */
.trace{width:0; overflow:hidden; border-left:1px solid var(--rule); background:var(--paper-2); transition:width .3s var(--ease); height:100vh; height:100dvh}
.trace.open{width:340px}
.trace .in{width:340px; height:100%; overflow-y:auto; padding:24px 20px; font:12px/1.7 var(--mono); color:var(--ink-2)}
.trace h3{font:700 13px/1 var(--serif); letter-spacing:.3em; color:var(--ink); margin:0 0 18px}
.trace .t-item{border-top:1px solid var(--rule); padding:12px 0}
.trace .t-item b{color:var(--ink); font-weight:400}
.trace .ok{color:var(--take)} .trace .bad{color:var(--shu)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

@media (max-width:820px){
  body, body.collapsed{grid-template-columns:1fr}
  /* 窄屏：侧栏变成左侧抽屉，始终是完整版，不能拖动调宽 */
  .side{position:fixed; inset:0 auto 0 0; width:min(300px,86vw); z-index:20; transform:translateX(-100%); transition:transform .28s var(--ease)}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block; position:fixed; inset:0; z-index:19; background:var(--scrim); animation:fadein .2s both}
  body.collapsed .full-only{display:flex}
  body.collapsed .rail-only, .grip, #collapse{display:none!important}
  body.collapsed .side-top{padding:12px 10px 8px 18px; justify-content:flex-start}
  body.collapsed .actions{align-items:stretch; padding:0 10px 4px}
  body.collapsed .account{display:block; padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
  body.collapsed .me-btn{width:100%; padding:8px 10px}
  body.collapsed .me-btn .meta, body.collapsed .me-btn .chev{display:block}
  #menu{display:inline-flex}
  .bar .model{display:none}
  .log{padding:16px}
  .compose{padding-left:12px; padding-right:12px}
  .empty h2{font-size:24px}
  .trace{display:none}
  .me{max-width:88%}
}
</style>
</head>

<aside class="trace" id="trace"><div class="in"><h3>运行记录</h3><div id="traceItems"><div class="t-item">发送消息后，这里显示路由、检索、来源和校验次数。</div></div></div></aside>

<script>
const $ = s => document.querySelector(s);
const state = { session: null, busy: false, arts: [], dev: false, practicing: false, sessions: [], balance: null };
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const track = (name, props) => post("/api/events", {name, props: props || {}}).catch(() => {});
const local = {  // 本机偏好（侧栏宽度、是否收起）；读写失败不影响使用
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};
const GRANT = 500;  // 注册赠送额度，用来画额度条
function setCredits(n){
  if (n == null) return;
  state.balance = n;
  $("#credits").textContent = `${n} credits`;
  $("#credits").classList.toggle("low", n < 50);
  $("#mCredits").textContent = `剩余 ${n} credits ≈ ¥${(n / 100).toFixed(2)}`;
  $("#mMeter").style.width = Math.max(2, Math.min(100, n / GRANT * 100)) + "%";
}

// 先转义再做极简 markdown：用户粘贴的 JD 和模型文本都会进页面
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KINDS = [["JD 原文","jd"],["参考资料","ref"],["从业者分享（未核实）","ext"],["待核实推断","inf"],["本人确认","me"],["面试原话","me"],["Offer 原文","jd"]];

function inline(s){
  s = esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(https?:\/\/[^\s，）)]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">原帖</a>');
  s = s.replace(/(mock:\/\/[^\s，）)]+)/g, '<span class="fake" title="模拟数据，无真实链接">$1</span>');
  for (const [label, cls] of KINDS) {
    if (s.startsWith(esc(label) + "：")) { s = `<span class="k ${cls}">${esc(label)}</span>` + s.slice(esc(label).length + 1); break; }
  }
  return s;
}

const SECTION = /^\*\*(依据|仍需确认|下一步|受阻原因)\*\*/;
function blockHtml(lines){
  let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of lines) {
    if (!line.trim()) { close(); continue; }
    const ul = line.match(/^- (.*)/), ol = line.match(/^\d+[.、]\s*(.*)/);
    if (ul || ol) {
      const tag = ul ? "ul" : "ol";
      if (list !== tag) { close(); html += `<${tag}>`; list = tag; }
      html += `<li>${inline((ul || ol)[1])}</li>`;
    } else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}
function md(text, chat){
  // 只在固定节标题处分节，正文里的空行只是换段，不画分隔线
  const sections = [[]];
  for (const line of text.trim().split("\n")) {
    if (SECTION.test(line)) sections.push([]);
    sections[sections.length - 1].push(line);
  }
  return sections.map((lines, i) => {
    if (chat && i === 0) {
      // 对话样式：最后一段是小谷接着问的问题，单独强调
      const body = lines.join("\n").trim().split(/\n{2,}/);
      const ask = body.length > 1 ? body.pop() : "";
      return blockHtml(body.join("\n\n").split("\n")) + (ask ? `<p class="ask">${inline(ask)}</p>` : "");
    }
    const block = /^\*\*受阻原因\*\*/.test(lines[0] || "") ? " block" : "";
    return `<div class="${i ? "sec" : ""}${block}">${blockHtml(lines)}</div>`;
  }).join("");
}

function setFresh(on){ document.body.classList.toggle("fresh", on); }

function addTurn(message){
  setFresh(false);
  const el = document.createElement("div");
  el.className = "turn";
  const me = document.createElement("div");
  me.className = "me" + (message.split("\n").length > 6 ? " long" : "");
  me.textContent = message;
  const name = document.createElement("p");
  name.className = "who"; name.textContent = "小谷 · AI 生成";
  const xg = document.createElement("div");
  xg.className = "xg";
  xg.innerHTML = '<p class="status"><span class="dots"><i></i><i></i><i></i></span><span class="txt">正在处理</span></p><div class="body"></div>';
  el.append(me, name, xg);
  $("#turns").append(el);
  $("#log").scrollTop = $("#log").scrollHeight;
  return xg;
}

function trace(t, status){
  const r = t.route || {};
  const attempts = (t.attempts || []).map((e, i) => `<div class="${e.length ? "bad" : "ok"}">第 ${i + 1} 次：${e.length ? esc(e.join("；")) : "通过校验"}</div>`).join("");
  const html = `<div class="t-item">
    <div><b>结果</b> ${esc(status)} · ${t.ms} ms · ${esc(t.provider)}/${esc(t.model)}</div>
    <div><b>路由</b> ${esc((r.pipeline || []).join(" → ") || r.status || "")}</div>
    <div><b>判断</b> ${esc({regex:"规则", llm:"模型分类", candidate:"候选选择"}[t.route_by] || "")}${t.intent ? " · " + esc(t.intent) : ""}${r.task ? " · " + esc(r.task) : ""}${t.role ? " · " + esc(t.role) : ""}</div>
    ${r.missing_inputs?.length ? `<div><b>缺材料</b> ${esc(r.missing_inputs.join("、"))}</div>` : ""}
    ${t.stored?.length ? `<div><b>存入会话</b> ${esc(t.stored.join("、"))}</div>` : ""}
    ${t.tools ? `<div><b>本地检索</b> 黑话 ${t.tools.jargon_hits} 条 · 职业 ${esc(t.tools.occupation.join("、") || "未命中")}</div>` : ""}
    ${attempts}</div>`;
  $("#traceItems").insertAdjacentHTML("afterbegin", html);
}

// 状态行只反映程序当前在哪一步（阶段名 + 已用秒数），不显示任何回答内容
function setStatus(xg, label, startedAt){
  const secs = Math.floor((performance.now() - startedAt) / 1000);
  xg.querySelector(".status .txt").textContent = `正在处理${label ? " · " + label : ""}${secs ? " · " + secs + " 秒" : ""}`;
}

// 回答是服务端校验通过后的完整文本；前端只把它逐字显示出来，不显示未校验的模型输出
function typeOut(xg, data){
  xg.querySelector(".status")?.remove();
  xg.className = "xg" + (data.status === "needs_input" ? " ask" : data.status === "blocked" ? " blocked" : "");
  const body = xg.querySelector(".body"), text = data.text, chat = data.style === "chat";
  const step = Math.max(1, Math.ceil(text.length / 400));  // 长回答加快，整体控制在约 6 秒内
  return new Promise(done => {
    let i = 0;
    const tick = () => {
      i = Math.min(text.length, i + step);
      body.innerHTML = md(text.slice(0, i), chat && i === text.length);
      if (i < text.length) setTimeout(tick, 16); else done();
    };
    tick();
  });
}

function setPractice(p){
  const active = !!p?.active;
  $("#prog").hidden = !active;
  $("#prog").textContent = active ? `模拟面试 ${p.question}/${p.total}` : "";
}

async function send(text){
  const message = (text ?? $("#input").value).trim();
  if (!message || state.busy) return;
  closeMenus();
  state.busy = true; $("#send").disabled = true; $("#input").value = ""; grow(); $("#ocrNote").hidden = true;
  const isNew = !state.session;
  const xg = addTurn(message);
  const startedAt = performance.now();
  let label = "";
  const clock = setInterval(() => setStatus(xg, label, startedAt), 1000);
  try {
    const res = await fetch("/api/chat/stream", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: state.session, message})});
    if (res.status === 401) { location.href = "/login"; return; }
    if (!res.ok || !res.body) throw new Error((await res.json().catch(() => ({}))).error || res.status);
    // SSE：按空行切事件，每个事件一行 data: JSON
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buf = "", final = null;
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      let cut;
      while ((cut = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, cut); buf = buf.slice(cut + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "stage") { label = ev.label; setStatus(xg, label, startedAt); }
        else if (ev.type === "final") final = ev;
        else if (ev.type === "error") throw new Error(ev.error);
      }
    }
    if (!final) throw new Error("连接中断");
    clearInterval(clock);
    state.session = final.session_id;
    if (final.trace) trace(final.trace, final.status);
    setCredits(final.credits?.balance);
    await typeOut(xg, final);
    if (final.note) {
      // 回答依据的来源（一般性建议 / 资料库）用小标签说明，不写进正文
      xg.insertAdjacentHTML("afterbegin", `<p class="betatag notetag"><span class="beta">${esc(final.note)}</span></p>`);
    }
    if (final.trace?.beta) {
      xg.insertAdjacentHTML("afterbegin", '<p class="betatag"><span class="beta">beta</span>这项功能还没有经过真实用户测试，结果请自己核对</p>');
    }
    if (final.artifact && /^\/resume\/[0-9a-f]+$/.test(final.artifact.url)) {
      xg.insertAdjacentHTML("beforeend", `<a class="artifact" href="${esc(final.artifact.url)}" target="_blank" rel="noopener">${esc(final.artifact.label)}</a>`);
      addArt(final.artifact);
    }
    if (final.practice?.active) {
      xg.insertAdjacentHTML("beforeend", `<p class="pq">模拟面试中 · 第 ${final.practice.question} / ${final.practice.total} 题 · 说“结束”可停下打分</p>`);
    }
    setPractice(final.practice);
    // 模拟面试开始 / 结束：按前后两轮的状态变化上报，后台「埋点」里能看到练习的开始数和完成数
    const active = !!final.practice?.active;
    if (active && !state.practicing) track("interview_start", {total: final.practice.total});
    if (!active && state.practicing) track("interview_end", {status: final.status});
    state.practicing = active;
    if (isNew) loadSessions();  // 新会话出现在历史最上面
  } catch (err) {
    clearInterval(clock);
    xg.querySelector(".status")?.remove();
    xg.querySelector(".body").innerHTML = `<p>这次没有发出去：${esc(String(err.message || err))}</p>`;
  } finally {
    state.busy = false; $("#send").disabled = false; $("#input").focus();
    // 长回答从开头读：把小谷的名字滚到可视区顶部，而不是直接滚到底
    xg.previousElementSibling.scrollIntoView({block: "start", behavior: "smooth"});
  }
}

async function fillSample(){
  const {jd} = await (await fetch("/api/sample")).json();
  $("#input").value = "帮我看看这个岗位：\n" + jd; grow(); $("#input").focus();
}

// “我的简历”：本页生成过的成品，链接只接受服务端给的 /resume/<id> 形式
function addArt(art){
  const m = art.label.match(/（(.+)）/);
  state.arts.unshift({url: art.url, name: m ? m[1] : "简历", at: new Date().toTimeString().slice(0, 5)});
  $("#artsBox").hidden = false;
  $("#arts").innerHTML = state.arts.slice(0, 3).map(a => `<a class="item" href="${esc(a.url)}" target="_blank" rel="noopener"><svg class="i"><use href="#i-doc"/></svg><span class="t">${esc(a.name)}</span><span class="sub">${esc(a.at)}</span></a>`).join("");
}

// ---------------- 历史对话：按最近更新时间分组，可搜索，点开恢复整段对话 ----------------
async function loadSessions(){
  const res = await fetch("/api/sessions");
  if (!res.ok) return;
  state.sessions = (await res.json()).sessions;
  renderSessions();
}
function renderSessions(){
  const q = $("#q").value.trim().toLowerCase();
  const list = state.sessions.filter(s => !q || (s.title || "").toLowerCase().includes(q));
  const day = 86400, today = new Date(); today.setHours(0, 0, 0, 0);
  const t0 = today.getTime() / 1000;
  const groups = [["今天", s => s.updated_at >= t0], ["昨天", s => s.updated_at >= t0 - day],
                  ["7 天内", s => s.updated_at >= t0 - 6 * day], ["更早", () => true]];
  let html = "", rest = list.slice(), n = 0;
  for (const [name, test] of groups) {
    const hit = rest.filter(test); rest = rest.filter(s => !test(s));
    if (!hit.length) continue;
    html += `<p class="group">${name}</p>` + hit.map(s => `<div class="item ${s.id === state.session ? "active" : ""}" data-sid="${esc(s.id)}" role="button" tabindex="0" style="animation-delay:${Math.min(n++, 12) * 18}ms">
      <span class="t">${esc(s.title || "未命名对话")}</span><button class="del" data-del="${esc(s.id)}" title="删除这段对话" aria-label="删除"><svg class="i" style="width:14px;height:14px"><use href="#i-x"/></svg></button></div>`).join("");
  }
  $("#hist").innerHTML = html || `<p class="none">${q ? "没有找到相关对话" : "你和小谷的对话会出现在这里"}</p>`;
}

async function openSession(id){
  if (state.busy) return;
  const res = await fetch(`/api/sessions/${encodeURIComponent(id)}`);
  if (!res.ok) return loadSessions();
  const {turns} = await res.json();
  state.session = id; state.practicing = false;
  $("#turns").innerHTML = ""; setPractice(null);
  setFresh(!turns.length);
  for (const t of turns) {
    const xg = addTurn(t.user_message || "");
    xg.querySelector(".status")?.remove();
    xg.className = "xg" + (t.status === "needs_input" ? " ask" : t.status === "blocked" ? " blocked" : "");
    xg.querySelector(".body").innerHTML = md(t.final_text || "（这一轮没有回答）", false);
  }
  document.querySelectorAll("#hist .item").forEach(el => el.classList.toggle("active", el.dataset.sid === id));
  document.body.classList.remove("drawer");
  $("#log").scrollTop = $("#log").scrollHeight;
}

function newChat(){
  state.session = null; state.practicing = false;
  $("#turns").innerHTML = ""; $("#traceItems").innerHTML = ""; setPractice(null);
  setFresh(true);
  document.querySelectorAll("#hist .item").forEach(el => el.classList.remove("active"));
  document.body.classList.remove("drawer");
  $("#input").focus();
}

$("#hist").addEventListener("click", async e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    if (!confirm("删除这段对话？删除后你将看不到它。")) return;
    const id = del.dataset.del;
    const row = del.closest(".item");
    row.style.transition = "opacity .2s, transform .2s"; row.style.opacity = "0"; row.style.transform = "translateX(-8px)";
    await fetch(`/api/sessions/${encodeURIComponent(id)}`, {method: "DELETE", headers: {"Content-Type": "application/json"}});
    if (id === state.session) newChat();
    return loadSessions();
  }
  const item = e.target.closest("[data-sid]");
  if (item) openSession(item.dataset.sid);
});
$("#hist").addEventListener("keydown", e => {
  const item = e.target.closest("[data-sid]");
  if (item && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openSession(item.dataset.sid); }
});
$("#q").addEventListener("input", renderSessions);

// ---------------- 弹出菜单：用户菜单、输入框 + 菜单 ----------------
function openMenu(menu, anchor){
  const wasOpen = menu.classList.contains("open");
  closeMenus();
  if (wasOpen) return;
  // 默认在按钮上方展开；上方放不下（如首页输入框居中时）就向下展开
  const r = anchor.getBoundingClientRect(), h = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8)) + "px";
  if (r.top - h - 8 >= 8) {
    menu.style.top = ""; menu.style.bottom = (innerHeight - r.top + 8) + "px"; menu.style.setProperty("--origin", "16px 100%");
  } else {
    menu.style.bottom = ""; menu.style.top = Math.min(r.bottom + 8, innerHeight - h - 8) + "px"; menu.style.setProperty("--origin", "16px 0");
  }
  menu.classList.add("open");
  anchor.setAttribute("aria-expanded", "true");
  menu.querySelector(".mi")?.focus({preventScroll: true});
}
function closeMenus(){
  document.querySelectorAll(".menu-pop.open").forEach(m => m.classList.remove("open"));
  document.querySelectorAll("[aria-expanded=true]").forEach(b => b.setAttribute("aria-expanded", "false"));
}
$("#meBtn").onclick = e => { e.stopPropagation(); openMenu($("#meMenu"), $("#meBtn")); };
$("#plus").onclick = e => { e.stopPropagation(); openMenu($("#plusMenu"), $("#plus")); };
document.addEventListener("click", e => { if (!e.target.closest(".menu-pop")) closeMenus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });
addEventListener("resize", closeMenus);

// ---------------- 侧栏：电脑端可拖动调宽、可收起成图标栏；宽度和收起状态记在本机 ----------------
const SIDE_MIN = 220, SIDE_MAX = 420, SIDE_DEFAULT = 264;
function setSide(w){
  w = Math.max(SIDE_MIN, Math.min(SIDE_MAX, Math.round(w)));
  document.documentElement.style.setProperty("--side-w", w + "px");
  return w;
}
setSide(parseInt(local.get("xg.sideW"), 10) || SIDE_DEFAULT);
if (local.get("xg.collapsed") === "1") document.body.classList.add("collapsed");
$("#grip").addEventListener("pointerdown", e => {
  e.preventDefault();
  const grip = e.currentTarget;
  grip.setPointerCapture(e.pointerId);
  grip.classList.add("on"); document.body.classList.add("resizing");
  const move = ev => setSide(ev.clientX);
  const up = ev => {
    local.set("xg.sideW", setSide(ev.clientX));
    grip.classList.remove("on"); document.body.classList.remove("resizing");
    grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up);
  };
  grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up);
});
$("#grip").addEventListener("dblclick", () => local.set("xg.sideW", setSide(SIDE_DEFAULT)));
const collapse = on => { closeMenus(); document.body.classList.toggle("collapsed", on); local.set("xg.collapsed", on ? "1" : "0"); };
$("#collapse").onclick = () => collapse(true);
$("#expand").onclick = () => collapse(false);
$("#searchRail").onclick = () => { collapse(false); setTimeout(() => $("#q").focus(), 280); };
$("#menu").onclick = () => document.body.classList.add("drawer");
$("#scrim").onclick = () => document.body.classList.remove("drawer");

function grow(){ const t = $("#input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 220) + "px"; }

$("#send").onclick = () => send();
$("#input").addEventListener("input", grow);
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#toggle").onclick = () => $("#trace").classList.toggle("open");
$("#newchat").onclick = newChat;
$("#newchatRail").onclick = newChat;
// 功能入口（+ 菜单和首页快捷按钮）只发起手句，缺什么材料由服务端判断后追问，前端不做第二套路由
const featureOf = q => /面试/.test(q) ? "interview" : /简历/.test(q) ? "resume" : "chat";
document.querySelectorAll("#plusMenu .mi:not(#ocrPick), #chips button").forEach(b => b.onclick = () => {
  closeMenus();
  const entry = b.dataset.sample ? "示例招聘说明" : b.textContent.trim().split(/\s/)[0];
  track("feature_open", {feature: b.dataset.sample ? "chat" : featureOf(b.dataset.q), entry, from: b.closest("#chips") ? "chips" : "plus"});
  b.dataset.sample ? fillSample() : send(b.dataset.q);
});
// 截图识别：图片在服务器本机转成文字后追加进输入框，由用户核对再发送；识别结果不会自动发出去
const OCR_MAX_W = 1440;  // 先在浏览器里缩小再上传：手机截图宽 1080–1290，文字清晰度够用，体积小很多
function shrink(file){
  return new Promise((ok, fail) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, OCR_MAX_W / img.naturalWidth), c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error("这张图片打不开")); };
    img.src = url;
  });
}
async function ocrFiles(files){
  const list = [...files].filter(f => /^image\//.test(f.type)).slice(0, 6);
  if (!list.length || state.ocrBusy) return;
  state.ocrBusy = true;
  const note = $("#ocrNote"); note.hidden = false;
  const parts = [];
  let failed = 0;
  for (const [i, f] of list.entries()) {
    note.textContent = `正在识别第 ${i + 1}/${list.length} 张图片……`;
    try {
      const res = await fetch("/api/ocr", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({image: await shrink(f)})});
      if (res.status === 401) { location.href = "/login"; return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.status);
      if (data.text) parts.push(data.text); else failed++;
    } catch (err) { failed++; note.textContent = `识别失败：${err.message}`; }
  }
  state.ocrBusy = false;
  track("feature_open", {feature: "chat", entry: "截图识别", from: "ocr", images: list.length, failed});
  if (!parts.length) { note.textContent = failed ? "没有识别出文字，可以换一张更清楚的截图，或直接把文字粘贴进来。" : ""; return; }
  const t = $("#input");
  t.value = (t.value.trim() ? t.value.trimEnd() + "\n\n" : "") + parts.join("\n\n");
  grow(); t.focus();
  note.textContent = `已从 ${parts.length} 张图片识别出文字${failed ? `（${failed} 张没识别出来）` : ""}，识别可能有错字，请核对后再发送。`;
}
$("#ocrPick").onclick = () => { closeMenus(); $("#ocrFile").click(); };
$("#ocrFile").onchange = e => { ocrFiles(e.target.files); e.target.value = ""; };
$("#input").addEventListener("paste", e => {
  const imgs = [...(e.clipboardData?.files || [])].filter(f => /^image\//.test(f.type));
  if (imgs.length) { e.preventDefault(); ocrFiles(imgs); }
});
const box = $(".compose .box");
box.addEventListener("dragover", e => { if ([...e.dataTransfer.items].some(i => i.type.startsWith("image/"))) { e.preventDefault(); box.classList.add("drop"); } });
box.addEventListener("dragleave", () => box.classList.remove("drop"));
box.addEventListener("drop", e => { box.classList.remove("drop"); if (e.dataTransfer.files.length) { e.preventDefault(); ocrFiles(e.dataTransfer.files); } });

document.addEventListener("click", e => {

const THEME_NAME = {mono: "黑底白线", wa: "和风"};
fetch("/api/me").then(r => {
  if (r.status === 401) { location.replace("/login"); return null; }
  return r.json();
}).then(me => {
  if (!me) return;
  $("#contact").textContent = $("#mContact").textContent = me.contact;
  setCredits(me.balance);
  if (me.theme === "wa") document.documentElement.dataset.theme = "wa";
  $("#themeName").textContent = THEME_NAME[me.theme] || THEME_NAME.mono;
  track("page_view", {page: "app", w: innerWidth});
  loadSessions();
});
$("#theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "wa" ? "mono" : "wa";
  if (next === "wa") document.documentElement.dataset.theme = "wa"; else delete document.documentElement.dataset.theme;
  $("#themeName").textContent = THEME_NAME[next];
  post("/api/me/theme", {theme: next});
  track("theme_change", {theme: next});
};
$("#logout").onclick = async () => { await post("/api/auth/logout", {}); location.replace("/"); };

fetch("/api/meta").then(r => r.json()).then(m => {
  // 生产环境不显示开发用的东西：环境标记、运行记录
  state.dev = m.env !== "prod";
  $("#envTag").hidden = $("#toggle").hidden = !state.dev;
  const filing = [];
  if (m.model_filing) filing.push(`生成式人工智能服务：DeepSeek · ${esc(m.model_filing)}`);
  if (m.icp) filing.push(`<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">${esc(m.icp)}</a>`);
  $("#filing").innerHTML = filing.join("<br>");
  $("#filing").hidden = !filing.length;
  if (m.maintenance) $("#emptySub").textContent = "小谷暂停服务中：" + (m.maintenance_reason || "请稍后再来");
  $("#provider").textContent = m.provider === "mock" ? "模拟模型（离线）" : m.model;
});
